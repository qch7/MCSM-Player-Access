<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCSManager · 玩家权限</title>
  <!--

    Target: MCSManager v10.21.2; Minecraft Java / Fabric 26.3.
    Import as an 扩展页面卡片 (HTML extension card), then save and refresh.

    or direct writes to Minecraft data files. Player avatars are loaded
    from Crafatar using public UUIDs, without panel credentials or referrers.
    Uses the logged-in user's existing permissions through window.$axios.

    https://github.com/MCSManager/MCSManager/blob/v10.21.2/frontend/src/tools/sandbox.ts

  -->
  <style>
    .mcsm-ac-v1{--ac-bg:var(--background-color-white,#fff);--ac-surface:var(--color-gray-2,#fafafa);--ac-line:var(--color-gray-4,#f0f0f0);--ac-border:var(--color-gray-5,#d9d9d9);--ac-fg:var(--color-gray-10,#262626);--ac-muted:var(--color-gray-7,#8c8c8c);--ac-accent:var(--color-blue-6,#1677ff);--ac-soft:var(--color-blue-1,#e6f4ff);--ac-good:var(--color-green-7,#389e0d);--ac-warn:var(--color-orange-7,#d46b08);--ac-danger:var(--color-red-6,#f5222d);box-sizing:border-box;container:mcsm-access / inline-size;width:100%;min-width:0;margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;color:var(--ac-fg);color-scheme:light}
    .mcsm-ac-v1[data-theme="dark"]{--ac-bg:var(--background-color-white,#202020);--ac-surface:var(--color-gray-4,#262626);--ac-line:var(--color-gray-4,#303030);--ac-border:var(--color-gray-5,#434343);--ac-fg:var(--color-gray-10,#f0f0f0);--ac-muted:var(--color-gray-7,#8c8c8c);--ac-accent:var(--color-blue-7,#3c89e8);--ac-soft:var(--color-blue-1,#111a2c);--ac-good:var(--color-green-7,#6abe39);--ac-warn:var(--color-orange-7,#e89a3c);--ac-danger:var(--color-red-7,#e84749);color-scheme:dark}
    .mcsm-ac-v1[data-standalone="true"]{padding:16px;background:var(--ac-bg)}
    .mcsm-ac-v1 *{box-sizing:border-box}
    .mcsm-ac-v1 [hidden]{display:none!important}
    .mcsm-ac-v1 .ac-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
    .mcsm-ac-v1 button,.mcsm-ac-v1 input{font:inherit}
    .mcsm-ac-v1 button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;margin:0;padding:4px 12px;border:1px solid var(--ac-border);border-radius:6px;background:transparent;color:var(--ac-fg);line-height:1.5;cursor:pointer;white-space:nowrap;transition:color .16s,border-color .16s,background .16s}
    .mcsm-ac-v1 button:hover:not(:disabled){color:var(--ac-accent);border-color:var(--ac-accent)}
    .mcsm-ac-v1 button:disabled{opacity:.4;cursor:not-allowed}
    .mcsm-ac-v1 button:focus-visible,.mcsm-ac-v1 input:focus-visible{outline:2px solid var(--ac-accent);outline-offset:3px}
    .mcsm-ac-v1 svg{display:block;width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .mcsm-ac-v1 .ac-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0 16px;border-bottom:1px solid var(--ac-line);margin-bottom:16px}
    .mcsm-ac-v1 .ac-tabs{display:flex;align-self:stretch;gap:24px;min-width:0}
    .mcsm-ac-v1 .ac-tab{position:relative;gap:6px;padding:0 0 12px;min-height:40px;border:0;border-radius:0;color:var(--ac-muted)}
    .mcsm-ac-v1 .ac-tab[aria-selected="true"]{color:var(--ac-accent);font-weight:500}
    .mcsm-ac-v1 .ac-tab[aria-selected="true"]::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--ac-accent);border-radius:2px}
    .mcsm-ac-v1 .ac-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border-radius:4px;background:var(--ac-surface);color:var(--ac-muted);font-size:11px;font-weight:400;font-variant-numeric:tabular-nums}
    .mcsm-ac-v1 .ac-tools{display:flex;align-items:center;gap:12px;padding-bottom:10px;margin-left:auto}
    .mcsm-ac-v1 .ac-state-line{display:flex;align-items:center;gap:8px;min-height:28px;color:var(--ac-muted);font-size:12px;white-space:nowrap}
    .mcsm-ac-v1 .ac-state-label{display:inline-flex;align-items:center;gap:6px}
    .mcsm-ac-v1 .ac-state-label::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ac-muted)}
    .mcsm-ac-v1 .ac-state-label[data-enabled="true"]::before{background:var(--ac-good)}
    .mcsm-ac-v1 .ac-switch{position:relative;display:block;width:28px;min-height:16px;height:16px;padding:0;border:0;border-radius:16px;background:var(--ac-muted)}
    .mcsm-ac-v1 .ac-switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0002;transition:transform .16s}
    .mcsm-ac-v1 .ac-switch[aria-checked="true"]{background:var(--ac-accent)}
    .mcsm-ac-v1 .ac-switch[aria-checked="true"]::after{transform:translateX(12px)}
    .mcsm-ac-v1 .ac-icon-button{width:28px;min-height:28px;padding:5px;border-color:transparent;color:var(--ac-muted)}
    .mcsm-ac-v1 .ac-icon-button:hover:not(:disabled),.mcsm-ac-v1 .ac-icon-button[aria-expanded="true"]{border-color:transparent;background:var(--ac-surface);color:var(--ac-accent)}
    .mcsm-ac-v1[aria-busy="true"] [data-action="refresh"] svg{animation:ac-refresh-spin 1s linear infinite}
    .mcsm-ac-v1 .ac-form{display:flex;align-items:center;gap:8px;margin:0 0 16px}
    .mcsm-ac-v1 .ac-field{display:flex;flex:1;min-width:0;flex-direction:column;gap:6px;color:var(--ac-muted);font-size:12px}
    .mcsm-ac-v1 input[type="text"],.mcsm-ac-v1 input[type="search"]{width:100%;min-width:0;height:34px;padding:5px 11px;border:1px solid var(--ac-border);border-radius:6px;background:transparent;color:var(--ac-fg);font-size:14px;line-height:22px;transition:border-color .16s}
    .mcsm-ac-v1 input::placeholder{color:var(--ac-muted);opacity:.8}
    .mcsm-ac-v1 input:hover:not(:disabled){border-color:var(--ac-accent)}
    .mcsm-ac-v1 input:disabled{cursor:not-allowed;opacity:.45}
    .mcsm-ac-v1 .ac-primary{height:34px;background:var(--ac-accent);border-color:var(--ac-accent);color:#fff}
    .mcsm-ac-v1 .ac-primary:hover:not(:disabled){color:#fff;filter:brightness(1.1)}
    .mcsm-ac-v1 .ac-primary[data-ban="true"]{background:var(--ac-danger);border-color:var(--ac-danger)}
    .mcsm-ac-v1 .ac-search{position:relative;margin:-4px 0 12px}
    .mcsm-ac-v1 .ac-search svg{position:absolute;left:10px;top:9px;color:var(--ac-muted)}
    .mcsm-ac-v1 .ac-search input{padding-left:34px}
    .mcsm-ac-v1 .ac-notice{padding:8px 10px;margin:0 0 12px;border-radius:4px;background:var(--ac-soft);color:var(--ac-accent);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
    .mcsm-ac-v1 .ac-notice[data-tone="success"]{background:transparent;color:var(--ac-good);padding:0;margin-bottom:10px}
    .mcsm-ac-v1 .ac-notice[data-tone="warning"]{background:var(--ac-surface);color:var(--ac-warn)}
    .mcsm-ac-v1 .ac-notice[data-tone="error"]{background:var(--ac-surface);color:var(--ac-danger)}
    .mcsm-ac-v1 .ac-table-box{max-height:320px;overflow:auto;scrollbar-width:thin}
    .mcsm-ac-v1 table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:left;font-size:13px}
    .mcsm-ac-v1 th{position:sticky;top:0;z-index:1;height:32px;padding:5px 12px;background:var(--ac-bg);border-bottom:1px solid var(--ac-line);color:var(--ac-muted);font-size:12px;font-weight:400;white-space:nowrap}
    .mcsm-ac-v1 td{height:52px;padding:8px 12px;border-bottom:1px solid var(--ac-line);vertical-align:middle}
    .mcsm-ac-v1 th:first-child,.mcsm-ac-v1 td:first-child{padding-left:0}
    .mcsm-ac-v1 th:last-child,.mcsm-ac-v1 td:last-child{padding-right:0}
    .mcsm-ac-v1 tbody tr:hover{background:var(--ac-surface)}
    .mcsm-ac-v1 .ac-identity{display:flex;align-items:center;gap:10px;min-width:0}
    .mcsm-ac-v1 .ac-avatar{position:relative;display:flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;overflow:hidden;border:1px solid var(--ac-line);border-radius:6px;background:var(--ac-surface);color:var(--ac-muted);font:500 12px/1 ui-monospace,SFMono-Regular,Consolas,monospace;user-select:none}
    .mcsm-ac-v1 .ac-avatar img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;opacity:0}
    .mcsm-ac-v1 .ac-avatar img[data-loaded="true"]{opacity:1}
    .mcsm-ac-v1 .ac-player-info{min-width:0}
    .mcsm-ac-v1 .ac-player{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
    .mcsm-ac-v1 .ac-ban-reason{margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ac-muted);font-size:12px}
    .mcsm-ac-v1 .ac-uuid{display:none;margin-top:2px;overflow-wrap:anywhere;color:var(--ac-muted);font:10px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}
    .mcsm-ac-v1[data-show-uuid="true"] .ac-uuid{display:block}
    .mcsm-ac-v1 .ac-level{width:64px;text-align:center}
    .mcsm-ac-v1 .ac-level-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:4px;background:var(--ac-surface);color:var(--ac-muted);font-size:12px;font-variant-numeric:tabular-nums}
    .mcsm-ac-v1 [data-ui="level-heading"][data-kind="bans"]{width:76px}
    .mcsm-ac-v1 .ac-expiry{width:76px;text-align:center;color:var(--ac-muted);font-size:11px;white-space:nowrap}
    .mcsm-ac-v1 .ac-actions{width:76px;text-align:right}
    .mcsm-ac-v1 .ac-danger{min-height:28px;padding:3px 6px;border-color:transparent;color:var(--ac-muted);font-size:12px}
    .mcsm-ac-v1 .ac-danger:hover:not(:disabled){border-color:transparent;background:var(--ac-surface);color:var(--ac-danger)}
    .mcsm-ac-v1 .ac-empty{height:120px;text-align:center;color:var(--ac-muted);font-size:12px}
    .mcsm-ac-v1 .ac-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px}
    .mcsm-ac-v1 .ac-footer{min-width:0;margin:0;color:var(--ac-muted);font-size:11px;font-variant-numeric:tabular-nums}
    .mcsm-ac-v1 .ac-settings-button{gap:4px;min-height:24px;padding:2px 0;border:0;color:var(--ac-muted);font-size:12px}
    .mcsm-ac-v1 .ac-settings-button svg{width:13px;height:13px}
    .mcsm-ac-v1 .ac-help{margin-top:12px;padding-top:12px;border-top:1px solid var(--ac-line);color:var(--ac-muted);font-size:12px}
    .mcsm-ac-v1 .ac-help p{margin:10px 0 0;line-height:1.7}
    .mcsm-ac-v1 .ac-check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
    .mcsm-ac-v1 .ac-check input{margin:0;accent-color:var(--ac-accent)}
    .mcsm-ac-v1 .ac-path-form{display:flex;align-items:end;gap:8px;margin-top:12px}
    .mcsm-ac-v1 .ac-path-form button{height:34px}
    .mcsm-ac-v1 code{padding:1px 4px;border-radius:3px;background:var(--ac-surface);color:var(--ac-fg);font:11px ui-monospace,SFMono-Regular,Consolas,monospace}
    @container mcsm-access (max-width:480px){.mcsm-ac-v1 .ac-head{gap:0 12px}.mcsm-ac-v1 .ac-tabs{gap:18px}.mcsm-ac-v1 .ac-tools{gap:8px}.mcsm-ac-v1 .ac-state-line{gap:6px}.mcsm-ac-v1 th,.mcsm-ac-v1 td{padding-left:8px;padding-right:8px}.mcsm-ac-v1 .ac-level{width:44px}.mcsm-ac-v1 .ac-actions{width:64px}}
    @container mcsm-access (max-width:480px){.mcsm-ac-v1 .ac-head{align-items:center;row-gap:6px}.mcsm-ac-v1[data-kind="whitelist"] .ac-tabs,.mcsm-ac-v1[data-kind="ops"] .ac-tabs{width:100%}.mcsm-ac-v1[data-kind="whitelist"] .ac-tools,.mcsm-ac-v1[data-kind="ops"] .ac-tools{width:100%;justify-content:flex-end;padding:8px 0}.mcsm-ac-v1[data-kind="whitelist"] .ac-state-line,.mcsm-ac-v1[data-kind="ops"] .ac-state-line{margin-right:auto}}
    @container mcsm-access (max-width:600px){.mcsm-ac-v1 .ac-form[data-kind="bans"]{flex-wrap:wrap}.mcsm-ac-v1 .ac-reason-field{order:3;flex:1 0 100%}}
    @keyframes ac-refresh-spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.mcsm-ac-v1 *,.mcsm-ac-v1 *::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<section class="mcsm-ac-v1" data-mcsm-access-card="1" aria-label="Minecraft 玩家权限">
  <header class="ac-head">
    <nav class="ac-tabs" role="tablist" aria-label="名单类型">
      <button type="button" class="ac-tab" role="tab" aria-selected="true" tabindex="0" data-action="tab-whitelist">白名单 <span class="ac-count" data-ui="count-whitelist">—</span></button>
      <button type="button" class="ac-tab" role="tab" aria-selected="false" tabindex="-1" data-action="tab-ops">OP <span class="ac-count" data-ui="count-ops">—</span></button>
      <button type="button" class="ac-tab" role="tab" aria-selected="false" tabindex="-1" data-action="tab-bans">黑名单 <span class="ac-count" data-ui="count-bans">—</span></button>
    </nav>
    <div class="ac-tools">
      <div class="ac-state-line" data-ui="whitelist-state" title="白名单入服限制">
        <span class="ac-state-label" data-ui="enabled">未读取</span>
        <button type="button" class="ac-switch" role="switch" aria-checked="false" aria-label="白名单入服限制" data-action="toggle-whitelist" disabled></button>
      </div>
      <div class="ac-state-line" data-ui="ops-state" hidden><span data-ui="op-level">默认等级 —</span></div>
      <button type="button" class="ac-icon-button" data-action="search" aria-label="搜索名单" title="搜索名单" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button>
      <button type="button" class="ac-icon-button" data-action="refresh" aria-label="刷新名单" title="刷新名单" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 17.9 17"/></svg></button>
    </div>
  </header>
  <form class="ac-form" data-ui="add-form" autocomplete="off">
    <label class="ac-field"><span class="ac-sr-only">玩家游戏名</span><input data-ui="name" type="text" autocomplete="off" spellcheck="false" maxlength="16" placeholder="玩家名，例如 Steve" aria-label="要添加的玩家游戏名" disabled></label>
    <label class="ac-field ac-reason-field" data-ui="reason-field" hidden><span class="ac-sr-only">封禁原因（可选）</span><input data-ui="reason" type="text" autocomplete="off" maxlength="160" placeholder="封禁原因（可选）" aria-label="封禁原因（可选）" disabled></label>
    <button class="ac-primary" type="submit" data-ui="add-button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-ui="add-label">添加</span></button>
  </form>
  <div class="ac-notice" data-ui="notice" role="status" aria-live="polite" hidden></div>
  <label class="ac-field ac-search" data-ui="search-field" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input data-ui="search" type="search" autocomplete="off" placeholder="搜索玩家名 / UUID" aria-label="搜索当前名单"></label>
  <div class="ac-table-box" role="tabpanel" data-ui="list-panel" aria-label="白名单">
    <table>
      <thead><tr><th scope="col">玩家</th><th scope="col" class="ac-level" data-ui="level-heading" hidden>等级</th><th scope="col" class="ac-actions">操作</th></tr></thead>
      <tbody data-ui="rows"><tr><td colspan="2" class="ac-empty">等待读取</td></tr></tbody>
    </table>
  </div>
  <footer class="ac-bottom">
    <p class="ac-footer" data-ui="footnote">未连接实例</p>
    <button class="ac-settings-button" type="button" data-action="settings" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.2-2 .9-2-.6L2.5 9l1.6 1.6v2.8L2.5 15l1.9 3.5 2-.6 2 .9L9 21h4l.6-2.2 2-.9 2 .6 1.9-3.5-1.6-1.6v-2.8L19.5 9l-1.9-3.5-2 .6-2-.9L13 3Z"/><circle cx="11" cy="12" r="3"/></svg>设置</button>
  </footer>
  <div class="ac-help" data-ui="help" hidden>
    <label class="ac-check"><input type="checkbox" data-ui="show-uuid">显示 UUID</label>
    <form class="ac-path-form" data-ui="path-form">
      <label class="ac-field">服务端目录<input data-ui="directory" type="text" value="/" placeholder="/" aria-label="MC 服务端相对目录" disabled></label>
      <button type="submit" data-ui="path-button" disabled>应用</button>
    </form>
    <p>填写实例内的相对目录，如 <code>server</code>；根目录用 <code>/</code>。按实例保存在当前浏览器。</p>
    <p>运行时可编辑；OP 等级沿用服务端设置。移出白名单不会踢出在线玩家，OP 可绕过白名单。</p>
    <p>黑名单使用 <code>ban / pardon</code>，封禁会踢出在线玩家；新增封禁为永久，可在列表中解除。</p>
    <p data-ui="install-help" hidden>导入：实例控制台 → 设计模式 → 扩展页面卡片 → 上传本文件 → 保存并刷新。</p>
  </div>
</section>
<script>
(function () {
  "use strict";
  const candidates = document.querySelectorAll('[data-mcsm-access-card="1"]:not([data-access-ready])');
  const root = candidates[candidates.length - 1];
  if (!root) return;
  root.setAttribute("data-access-ready", "1");
  const real = window.$realWindow || window;
  const axios = window.$axios;
  const ui = (name) => root.querySelector('[data-ui="' + name + '"]');
  const buttons = (action) => root.querySelector('[data-action="' + action + '"]');
  // MCSManager binds function-valued bridge properties. The bound Axios callable
  // does not retain static helpers such as .request; invoke it as a function.
  const bridgeAvailable = Boolean(window.$realWindow && axios && (typeof axios === "function" || typeof axios.request === "function") && typeof window.$onMounted === "function");
  const KINDS = ["whitelist", "ops", "bans"];
  const LABELS = { whitelist: "白名单", ops: "OP 名单", bans: "黑名单", properties: "服务器设置" };
  const FILES = { whitelist: "whitelist.json", ops: "ops.json", bans: "banned-players.json" };
  const emptyLists = () => ({ whitelist: null, ops: null, bans: null });
  const state = { context: null, generation: 0, busy: false, destroyed: false, tab: "whitelist", instance: null, lists: emptyLists(), properties: null, errors: {}, notice: "", tone: "info", lastRead: null };
  const controllers = new Set();
  const waits = new Map();
  const failedAvatars = new Set();
  let contextWatch = null;
  let themeObserver = null;
  let colorScheme = null;
  let lastRequestAt = 0;
  const NAME = /^[A-Za-z0-9_]{1,16}$/;
  const UUID = /^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i;
  const STATUS = { "-1": "忙碌", "0": "已停止", "1": "正在停止", "2": "正在启动", "3": "运行中" };
  const ENDPOINT = { instance: "./api/instance", config: "./api/protected_instance/process_config/file", command: "./api/protected_instance/command" };

  function cancelled() { const error = new Error("实例已切换或卡片已关闭"); error.name = "CardCancelled"; return error; }
  function isCancelled(error) { return error && (error.name === "CardCancelled" || error.name === "AbortError" || error.code === "ERR_CANCELED"); }
  function routeContext() {
    const hash = real.location.hash || "";
    const question = hash.indexOf("?");
    const route = question < 0 ? hash : hash.slice(0, question);
    if (!route.startsWith("#/instances/terminal")) return null;
    const params = new URLSearchParams(question < 0 ? "" : hash.slice(question + 1));

    event.preventDefault(); if (state.busy || !state.context) return;

    ui("list-panel").id = id + "-list";
    ui("help").id = id + "-settings";
    ui("search-field").id = id + "-search";
    buttons("settings").setAttribute("aria-controls", ui("help").id);
    buttons("search").setAttribute("aria-controls", ui("search-field").id);
    KINDS.forEach((kind) => {
      buttons("tab-" + kind).id = id + "-" + kind;
      buttons("tab-" + kind).setAttribute("aria-controls", ui("list-panel").id);
    });
    root.addEventListener("click", handleClick);
    root.addEventListener("keydown", handleTabKey);
    ui("show-uuid").addEventListener("change", showUuid);
    ui("add-form").addEventListener("submit", addSubmit);
    ui("path-form").addEventListener("submit", pathSubmit);
    ui("search").addEventListener("input", renderRows);
    if (!bridgeAvailable) {
      root.dataset.standalone = "true";
      ui("install-help").hidden = false;
      message("请上传到 MCSManager 的扩展页面卡片。导入步骤见设置。");

  else mount();
})();
